; SPECTRA-SHIELD V1 - PlatformIO project
; Three firmware targets share lib/spectra_common and differ only by which
; main.cpp under src/ is compiled (selected via build_src_filter).

[platformio]
default_envs = uav_node

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSPECTRA_STRICT_AUTH=1

[env:uav_node]
extends = common
build_src_filter = +<uav_node/>

[env:ground_node]
extends = common
build_src_filter = +<ground_node/>

[env:interferer]
; The interferer may run on a plain ESP32 with a CC1101 breakout. Override the
; board below if you use an ESP32-S3 dev board for it as well.
extends = common
board = esp32dev
build_src_filter = +<interferer/>
